name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'engine[test]' -e 'api[test]'
      - run: pytest -q engine
      - run: pytest -q api

  postgres:
    # The record, audit and export tests again, on PostgreSQL 16 as in the hospital.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pe
          POSTGRES_PASSWORD: pe
          POSTGRES_DB: pe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pe" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'engine[test]' -e 'api[test]'
      - run: pytest -q api/tests/test_records.py
        env:
          PE_TEST_DATABASE_URL: postgresql+psycopg://pe:pe@127.0.0.1:5432/pe_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  docker:
    # The image the hospital server runs must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vinmec/pe-risk:ci .
      - name: image starts and answers
        run: |
          docker run -d --name pe -p 8000:8000 -e PE_DATABASE_URL=sqlite:////tmp/pe.db vinmec/pe-risk:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs pe; exit 1
