name: standalone website

# Publishes the standalone calculator (one HTML file, calculates in the browser, stores nothing)
# to GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths: ["web/**", "engine/pe_risk/coefficients/**", ".github/workflows/standalone-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
