[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-api"
version = "0.4.0"
description = "HTTP API for the Vinmec preeclampsia risk engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pe-risk", "sqlalchemy>=2.0", "alembic>=1.13", "ldap3>=2.9", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["pe_api*"]

[tool.setuptools.package-data]
pe_api = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
